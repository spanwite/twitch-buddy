name: Multi-Platform Bun Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          # linux
          - os: ubuntu-latest
            target: linux-x64

          - os: ubuntu-latest
            target: linux-arm64

          # macos
          - os: macos-latest
            target: darwin-x64

          - os: macos-latest
            target: darwin-arm64

          # windows
          - os: windows-latest
            target: windows-x64

    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      AppName: TwitchBuddy
      ReleaseName: TwitchBuddy_${{ github.ref_name }}_${{ matrix.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build binary
        run: |
          mkdir build
          bun build --compile --minify --sourcemap src/main.ts --target=bun-${{ matrix.target }} --outfile build/${{ env.AppName }}

      - name: Prepare release directory
        run: |
          mkdir release
          cp build/* release/
          cp .env.example release/.env
          cp README.md release/

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: zip -r ${{ env.ReleaseName }}.zip ./release/

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path release/* -DestinationPath "${{ env.ReleaseName }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ReleaseName }}
          path: ${{ env.ReleaseName }}.zip

  release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*.zip
